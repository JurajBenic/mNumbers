[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnumbers"
version = "0.1.0"
description = "A Python library for working with m-numbers (MNumber)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Juraj Benić", email = "jbenic@mathos.hr" },
]
keywords = ["m-numbers", "mathematics", "algebra"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/JurajBenic/mNumbers"
Repository = "https://github.com/JurajBenic/mNumbers"

[tool.hatch.build.targets.wheel]
packages = ["mnumbers"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["mnumbers", "tests"]
